name: protectora-oracle

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-protectora}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env.oracle}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - private
    logging: *default-logging

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile.prod
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env.oracle}@db:5432/${POSTGRES_DB:-protectora}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env.oracle}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Define MFA_ENCRYPTION_KEY en .env.oracle}
      CORS_ORIGINS: ${CORS_ORIGINS:?Define CORS_ORIGINS en .env.oracle}
      ADMIN_BOOTSTRAP_KEY: ${ADMIN_BOOTSTRAP_KEY:-}
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - private
      - app
    logging: *default-logging

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile.prod
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app
    logging: *default-logging

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Define APP_DOMAIN en .env.oracle}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.oracle:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app
    logging: *default-logging

volumes:
  postgres_data:
  backend_uploads:
  caddy_data:
  caddy_config:

networks:
  private:
    internal: true
  app: