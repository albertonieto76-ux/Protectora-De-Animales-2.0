services:
  db:
    image: postgres:16-alpine
    container_name: protectora-db
    environment:
      POSTGRES_DB: protectora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d protectora"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: protectora-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/protectora?schema=public
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "4000:4000"
    volumes:
      - ../backend:/app
      - backend_node_modules:/app/node_modules
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: protectora-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: /api
      VITE_BACKEND_TARGET: http://backend:4000
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
